name: Agent 7 — Job Quality & Enrichment Pipeline

on:
  schedule:
    # Trigger every 6 hours independently of scraper ingestion workflows
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: 'Force re-process all active jobs'
        required: false
        default: 'false'

jobs:
  agent7_quality_enrichment:
    name: Agent 7 Quality & Enrichment Run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install sqlalchemy psycopg2-binary pydantic httpx requests

      - name: Run Agent 7 Quality & Enrichment Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python backend/app/agents/agent7_quality/run_agent7.py
