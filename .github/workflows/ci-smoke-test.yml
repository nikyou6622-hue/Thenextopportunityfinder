name: Production Pre-Deploy CI Gate & API Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test-api-routes:
    name: Cold-Start Import & API Route Health Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run Cold-Start Import Test (VERCEL=1)
        env:
          VERCEL: "1"
          VERCEL_ENV: "production"
          CI_SMOKE_TEST: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "from backend.app.main import app; print('SUCCESS: FastAPI app imported cleanly under Vercel cold-start environment!')"

      - name: Execute End-to-End API Route Health Check (Dedicated CI Profile 999999 + Automatic Cleanup)
        env:
          VERCEL: "1"
          VERCEL_ENV: "production"
          CI_SMOKE_TEST: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, sys
          from fastapi.testclient import TestClient
          from backend.app.main import app
          from backend.app.db.database import SessionLocal
          from backend.app.db.models import ProfileModel, UserModel, SubscriptionModel

          CI_TEST_PROFILE_ID = 999999
          client = TestClient(app, raise_server_exceptions=False)
          routes = [
              ('GET', f'/api/health'),
              ('GET', f'/api/profile?profile_id={CI_TEST_PROFILE_ID}'),
              ('GET', f'/api/matches?profile_id={CI_TEST_PROFILE_ID}'),
              ('GET', f'/api/auth/me'),
              ('GET', f'/api/dashboard/metrics'),
              ('GET', f'/api/internships/india'),
              ('GET', f'/api/applications?profile_id={CI_TEST_PROFILE_ID}'),
              ('GET', f'/api/subscription/status?profile_id={CI_TEST_PROFILE_ID}'),
          ]

          failed = False
          print('Executing Production API Route Verification Gate (Isolated CI Profile 999999)...')
          for method, path in routes:
              resp = client.get(path, headers={'x-api-key': 'dev_test_key'})
              print(f'  {method:<4} {path:<40} -> HTTP {resp.status_code}')
              if resp.status_code >= 500:
                  print(f'  [FAIL]: Endpoint {path} returned HTTP {resp.status_code}')
                  failed = True

          # Explicit post-execution cleanup for dedicated CI Profile ID 999999
          db = SessionLocal()
          try:
              db.query(SubscriptionModel).filter(SubscriptionModel.profile_id == CI_TEST_PROFILE_ID).delete(synchronize_session=False)
              db.query(ProfileModel).filter(ProfileModel.id == CI_TEST_PROFILE_ID).delete(synchronize_session=False)
              db.commit()
              print(f'SUCCESS: Cleaned up transient CI test profile {CI_TEST_PROFILE_ID} from database.')
          except Exception as ex:
              db.rollback()
              print(f'CI Cleanup notice: {ex}')
          finally:
              db.close()

          if failed:
              sys.exit(1)
          print('ALL CORE API ROUTES PASSED PRE-DEPLOY CI GATE CLEANLY!')
          "
