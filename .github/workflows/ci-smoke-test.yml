name: Production Pre-Deploy CI Gate & API Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test-api-routes:
    name: Cold-Start Import & API Route Health Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run Cold-Start Import Test (VERCEL=1)
        env:
          VERCEL: "1"
          VERCEL_ENV: "production"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "from backend.app.main import app; print('SUCCESS: FastAPI app imported cleanly under Vercel cold-start environment!')"

      - name: Execute End-to-End API Route Health Check
        env:
          VERCEL: "1"
          VERCEL_ENV: "production"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -c "
          import os, sys
          from fastapi.testclient import TestClient
          from backend.app.main import app

          client = TestClient(app, raise_server_exceptions=False)
          routes = [
              ('GET', '/api/health'),
              ('GET', '/api/profile'),
              ('GET', '/api/matches'),
              ('GET', '/api/auth/me'),
              ('GET', '/api/dashboard/metrics'),
              ('GET', '/api/internships/india'),
              ('GET', '/api/applications'),
              ('GET', '/api/subscription/status'),
              ('POST', '/api/subscription/scrape'),
          ]

          failed = False
          print('Executing Production API Route Verification Gate...')
          for method, path in routes:
              if method == 'GET':
                  resp = client.get(path, headers={'x-api-key': 'dev_test_key'})
              else:
                  resp = client.post(path, json={'profile_id': 1}, headers={'x-api-key': 'dev_test_key'})
              print(f'  {method:<4} {path:<30} -> HTTP {resp.status_code}')
              if resp.status_code >= 500:
                  print(f'  [FAIL]: Endpoint {path} returned HTTP {resp.status_code}')
                  failed = True

          if failed:
              sys.exit(1)
          print('ALL CORE API ROUTES PASSED PRE-DEPLOY CI GATE!')
          "
