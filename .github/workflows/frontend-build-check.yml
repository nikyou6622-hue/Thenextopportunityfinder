name: Frontend Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build & Duplicate Guard Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify no broken imports on a clean checkout
        run: |
          git clone --depth 1 https://github.com/nikyou6622-hue/Thenextopportunityfinder.git /tmp/clean-checkout
          cd /tmp/clean-checkout/web
          npm install
          npm run check:imports

      - name: Install dependencies & Build Frontend
        run: |
          cd web
          npm install
          npm run build
