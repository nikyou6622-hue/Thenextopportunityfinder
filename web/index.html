<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#080b14" />
    <!-- Automatic ServiceWorker & CacheStorage purge for fresh build deployment -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) { registration.unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
    </script>

    <!-- Prevent Stale Browser Cache of Old Chunks -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Primary Meta Tags -->
    <title>NextOpportunityFinder — Land Your Dream Job</title>
    <meta name="title" content="NextOpportunityFinder — Land Your Dream Job" />
    <meta name="description" content="Build an ATS-proof resume, apply to real verified openings, and walk into every interview prepared — all in one place. DPDP Act 2023 compliant." />
    <meta name="keywords" content="NextOpportunityFinder, ATS Resume Studio, Verified Job Openings, India Internships Hub, Voice AI Mock Interview, Company Question Banks, DPDP Act Compliant" />
    <meta name="author" content="NextOpportunityFinder Platform Studio" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thenextopportunityfinder.com/" />
    <meta property="og:title" content="NextOpportunityFinder — Land Your Dream Job" />
    <meta property="og:description" content="Build an ATS-proof resume, apply to real verified openings, and walk into every interview prepared — all in one place." />
    <meta property="og:image" content="/thumbnails/fullstack_track_thumb.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="NextOpportunityFinder — Land Your Dream Job" />
    <meta property="twitter:description" content="Build an ATS-proof resume, apply to real verified openings, and walk into every interview prepared — all in one place." />
    <meta property="twitter:image" content="/thumbnails/fullstack_track_thumb.png" />

    <!-- Fonts Preconnect & Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Zero-Flash Dark Mode Initialization */
      html, body {
        background-color: #080b14;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      
      /* Subtle Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(8, 11, 20, 0.95);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.35);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
